[project]
name = "penumbra-assetgen"
version = "0.1.0"
description = "Local 2D texture generator for Penumbra (FLUX.2 klein 4B through mflux)"
requires-python = "==3.12.*"
# Core: post-processing (seams, normal maps, roughness, previews, provenance). Runs anywhere, no model.
dependencies = [
    "numpy==2.3.5",
    "pillow==13.0.0",
]

[project.optional-dependencies]
# Image generation: Apple Silicon only (MLX).
gen = [
    "mflux==0.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
